name: Update age in README

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-age:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute age and patch README
        run: |
          BIRTH="2008-07-04"
          TODAY=$(date -u +%Y-%m-%d)
          AGE=$(( ( $(date -u -d "$TODAY" +%s) - $(date -u -d "$BIRTH" +%s) ) / 31556952 ))
          sed -i -E "s/<!--AGE-->[0-9]+<!--\/AGE-->/<!--AGE-->${AGE}<!--\/AGE-->/" README.md
          echo "Computed age: $AGE"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "chore: update age"
          git push
